<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solid Carbon 3D</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        model-viewer {
            width: 100%;
            height: 80vh;
	    background-colour: "#78cbff";
        }

        /* Hotspot labels */
        .Hotspot {
            background: #fff;
            border: 1px solid #000;
            padding: 4px 8px;
        }

        /* Hide labels when they're behind the model */
        .Hotspot:not([data-visible]) {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div>
        <button onclick="loadModel('seafloor_v2.glb', 'hotspots-seafloor')">Seafloor</button>
        <button onclick="loadModel('cork.glb')">Cork</button>
        <button onclick="loadModel('cork1362A.glb')">Cork 1362A</button>
    </div>

    <model-viewer
        id="viewer"
        src="seafloor_v2.glb"
        camera-controls
        auto-rotate
        ar
        tone-mapping="neutral"
        shadow-intensity="1">
    </model-viewer>

    <!-- Seafloor labels, as exported from the model-viewer editor -->
    <template id="hotspots-seafloor">
        <button class="Hotspot" slot="hotspot-16" data-position="-2.6144122364278335m 31.322003185749054m -7.407782075377909m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
            <div class="HotspotAnnotation">Borehole 1026B</div>
        </button>
        <button class="Hotspot" slot="hotspot-18" data-position="-5.949722283283048m 31.322003185749054m 1.419169811999489m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
            <div class="HotspotAnnotation">Borehole 1362A</div>
        </button>
        <button class="Hotspot" slot="hotspot-19" data-position="-6.387578594711572m 31.322003185749054m 9.732280820406366m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
            <div class="HotspotAnnotation">Borehole 1362B</div>
        </button>
        <button class="Hotspot" slot="hotspot-20" data-position="69.26033237908582m 31.322003185749054m 2.388470021688531m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
            <div class="HotspotAnnotation">Borehole 1027C</div>
        </button>
        <button class="Hotspot" slot="hotspot-21" data-position="69.19022647956217m -29.40893443237777m 26.939818382263155m" data-normal="0m 0m 1m" data-visibility-attribute="visible">
            <div class="HotspotAnnotation">Basement Basalt</div>
        </button>
        <button class="Hotspot" slot="hotspot-22" data-position="68.93623053224456m 2.843571165615721m 26.517255783081055m" data-normal="0m 0m 1m" data-visibility-attribute="visible">
            <div class="HotspotAnnotation">Sediment</div>
        </button>
        <button class="Hotspot" slot="hotspot-24" data-position="69.4674613039933m 30.823573553004216m 26.517255783081055m" data-normal="0m 0m 1m" data-visibility-attribute="visible">
            <div class="HotspotAnnotation">Seafloor</div>
        </button>
    </template>

    <script>
        const viewer = document.getElementById("viewer");

        function loadModel(src, hotspotsId) {
            // Remove any labels from the previous model
            viewer.querySelectorAll(".Hotspot").forEach(el => el.remove());

            // Add this model's labels, if it has any
            if (hotspotsId) {
                const template = document.getElementById(hotspotsId);
                viewer.appendChild(template.content.cloneNode(true));
            }

            // Reset the camera so each model is framed fresh
            viewer.cameraOrbit = "auto auto auto";
            viewer.cameraTarget = "auto auto auto";
            viewer.fieldOfView = "auto";

            viewer.src = src;
        }

        viewer.addEventListener("load", () => viewer.jumpCameraToGoal());

        // Show the seafloor labels on first load
        loadModel("seafloor_v2.glb", "hotspots-seafloor");
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solid Carbon 3D</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        :root {
            --ink: #14293b;
            --muted: #5b6b76;
            --accent: #1f7a8c;
            --panel-bg: rgba(255, 255, 255, 0.97);
            --panel-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
            --radius: 5px;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #eef2f3;
            color: var(--ink);
        }

        header#topbar {
            height: 56px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            padding: 0 16px;
            background: var(--ink);
            border-bottom: 3px solid var(--accent);
        }

        .topbar-title h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: white;
            letter-spacing: -0.01em;
        }

        .topbar-title span {
            display: block;
            margin-top: 2px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        /* Model and camera-view selectors, styled as segmented pill controls */
        .model-select, .view-select {
            display: flex;
            gap: 4px;
            width: fit-content;
            padding: 5px;
            background: var(--panel-bg);
            border-radius: 999px;
            box-shadow: var(--panel-shadow);
        }

        .model-select button, .view-select button {
            border: none;
            background: transparent;
            padding: 8px 18px;
            border-radius: 999px;
            font: 600 13px "Inter", sans-serif;
            color: var(--muted);
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .model-select button:hover, .view-select button:hover {
            background: #eef4f5;
            color: var(--accent);
        }

        .model-select button.active, .view-select button.active {
            background: var(--accent);
            color: white;
        }

        .viewer-wrap {
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--panel-shadow);
        }

        model-viewer {
            width: 100%;
            height: 75vh;
            background-color: #fcfbfb;
        }

        /* Hotspot labels */
        .Hotspot {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--panel-bg);
            border: none;
            border-radius: var(--radius);
            box-shadow: var(--panel-shadow);
            padding: 5px 10px;
            font: 500 12px "Inter", sans-serif;
            color: var(--ink);
        }

        /* Hide labels when they're behind the model */
        .view-select[hidden] {
            display: none;
        }

        .Hotspot:not([data-visible]) {
            opacity: 0;
            pointer-events: none;
        }

        /* Invisible points used only to anchor dimension lines */
        .DimAnchor {
            width: 0;
            height: 0;
            padding: 0;
            border: 0;
        }

        /* Dimension lines/labels overlay */
        #dimension-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* Compass: tracks the horizontal (azimuth) rotation of the model */
        #compass {
            position: absolute;
            right: 16px;
            bottom: 16px;
            width: 72px;
            height: 72px;
            z-index: 6;
            pointer-events: none;
            background: var(--panel-bg);
            border-radius: 50%;
            box-shadow: var(--panel-shadow);
        }

        #compass-needle {
            transform-origin: 36px 36px;
        }
    </style>
</head>
<body>

    <header id="topbar">
        <div class="topbar-title">
            <h1>Solid Carbon 3D</h1>
            <span>Interactive seafloor &amp; borehole models</span>
        </div>
    </header>

    <main>
        <div class="controls">
            <div class="model-select">
                <button onclick="loadModel('seafloor_v4.glb', 'hotspots-seafloor', this)" class="active">Seafloor</button>
                <button onclick="loadModel('cork-draco.glb', null, this)">Cork</button>
                <button onclick="loadModel('cork1362A-draco.glb', null, this)">Cork 1362A</button>
            </div>
            <!-- Camera presets for the seafloor model (see cameraViews in the script) -->
            <div class="view-select" id="view-select">
                <button data-view="overview" class="active">Overview</button>
                <button data-view="layers">Basement Layers</button>
                <button data-view="injection">Injection site</button>
                <button data-view="monitoring">Monitoring site</button>
            </div>
        </div>

        <div class="viewer-wrap">
            <model-viewer
                id="viewer"
                src="seafloor_v4.glb"
                camera-controls
                ar
                tone-mapping="neutral"
                shadow-intensity="0"
                min-camera-orbit="auto auto 15m"
                min-field-of-view='1deg'>
            </model-viewer>

            <svg id="dimension-overlay"></svg>

            <svg id="compass" viewBox="0 0 72 72" aria-label="Compass">
                <circle cx="36" cy="36" r="33" fill="none" stroke="currentColor" stroke-opacity="0.25" />
                <g id="compass-needle">
                    <polygon points="36,19 42,36 30,36" style="fill: var(--accent);" />
                    <polygon points="36,53 42,36 30,36" fill="#999" />
                    <text x="36" y="15" text-anchor="middle" font-size="11" font-weight="700" font-family="Inter, sans-serif" style="fill: var(--accent);">N</text>
                    <g font-size="9" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle" fill="#666">
                        <text x="36" y="66">S</text>
                        <text x="63" y="39.5">E</text>
                        <text x="9" y="39.5">W</text>
                    </g>
                </g>
                <circle cx="36" cy="36" r="2.5" fill="#333" />
            </svg>
        </div>
    </main>

    <!-- Seafloor labels, as exported from the model-viewer editor -->
    <template id="hotspots-seafloor">
        <button class="Hotspot" slot="hotspot-1" data-position="-1053.2547602494767m 0m -178.7172727747188m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
            <div class="HotspotAnnotation">Borehole 1026B</div>
        </button>
        <button class="Hotspot" slot="hotspot-3" data-position="-1202.4134293512127m -1.4210854715202004e-14m 1.9995459612104014m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
            <div class="HotspotAnnotation">Borehole 1362A</div>
        </button>
        <button class="Hotspot" slot="hotspot-4" data-position="-1274.2148534180235m 0m 305.8217231597523m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
            <div class="HotspotAnnotation">Borehole 1362B</div>
        </button>
        <button class="Hotspot" slot="hotspot-5" data-position="-1513.61040564326m 0m 775.4433657001365m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
            <div class="HotspotAnnotation">Borehole 1301B</div>
        </button>
        <button class="Hotspot" slot="hotspot-6" data-position="1059.5668762121697m 0m 470.97399151243013m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
            <div class="HotspotAnnotation">Borehole 1027C</div>
        </button>
        <button id="hs-seafloor-top" class="Hotspot" slot="hotspot-8" data-position="1975.124209101059m 0m 1920.5047987284338m" data-normal="0m 1m 0m" data-visibility-attribute="visible">
            <div class="HotspotAnnotation">Seafloor</div>
        </button>
        <!-- Invisible anchors on the west wall at each layer's mid-depth; their labels are drawn by updateLayerLabels() -->
        <button id="layer-anchor-0" class="DimAnchor" slot="hotspot-10" data-position="-2400m -362.1m 897.8m" data-normal="-1m 0m 0m" data-visibility-attribute="visible"></button>
        <button id="layer-anchor-1" class="DimAnchor" slot="hotspot-11" data-position="-2400m -403.6m 897.8m" data-normal="-1m 0m 0m" data-visibility-attribute="visible"></button>
        <button id="layer-anchor-2" class="DimAnchor" slot="hotspot-12" data-position="-2400m -421.0m 897.8m" data-normal="-1m 0m 0m" data-visibility-attribute="visible"></button>
        <button id="layer-anchor-3" class="DimAnchor" slot="hotspot-13" data-position="-2400m -473.1m 897.8m" data-normal="-1m 0m 0m" data-visibility-attribute="visible"></button>
        <button id="layer-anchor-4" class="DimAnchor" slot="hotspot-14" data-position="-2400m -604.0m 897.8m" data-normal="-1m 0m 0m" data-visibility-attribute="visible"></button>

        <!-- Invisible anchors marking the model's footprint corners (bottom of the layers at -700 m), used only to draw its dimension lines -->
        <button id="hs-basement-cornerA" class="DimAnchor" slot="hotspot-30" data-position="-2400m -700m -1577.300048828125m" data-normal="0m 1m 0m" data-visibility-attribute="visible"></button>
        <button id="hs-basement-cornerB" class="DimAnchor" slot="hotspot-31" data-position="2100m -700m -1577.300048828125m" data-normal="0m 1m 0m" data-visibility-attribute="visible"></button>
        <button id="hs-basement-cornerC" class="DimAnchor" slot="hotspot-32" data-position="2100m -700m 1922.699951171875m" data-normal="0m 1m 0m" data-visibility-attribute="visible"></button>
        <button id="hs-seafloor-corner" class="DimAnchor" slot="hotspot-33" data-position="2100m 0m 1922.699951171875m" data-normal="0m 1m 0m" data-visibility-attribute="visible"></button>
        <button id="dim-1026B" class="DimAnchor" slot="hotspot-40" data-position="-1053.2547602494767m 0m -178.7172727747188m" data-normal="0m 1m 0m" data-visibility-attribute="visible"></button>
        <button id="dim-1362A" class="DimAnchor" slot="hotspot-41" data-position="-1202.4134293512127m -1.4210854715202004e-14m 1.9995459612104014m" data-normal="0m 1m 0m" data-visibility-attribute="visible"></button>
        <button id="dim-1362B" class="DimAnchor" slot="hotspot-42" data-position="-1274.2148534180235m 0m 305.8217231597523m" data-normal="0m 1m 0m" data-visibility-attribute="visible"></button>
    </template>

    <script>
        const viewer = document.getElementById("viewer");

        // Camera presets. orbit = "azimuth polar radius" about the target; azimuth is measured from +Z (south),
        // so -90deg looks at the west face. Positions are scene metres, as in the hotspots.
        const cameraViews = {
            overview:   { orbit: "0deg 75deg auto", target: "auto auto auto", fov: "auto" },
            layers:     { orbit: "-62deg 74deg 1000m", target: "-2400m -480m 900m", fov: "30deg" },   // west wall, labels in view
            // Close-ups: a narrow field of view from ~40 m away fills the frame with the ~7 m cork. Moving the camera
            // in closer instead would put the cork inside model-viewer's near plane (about 10 m here) and clip it.
            injection:  { orbit: "35deg 78deg 40m", target: "-1203.3m 3.4m 0m", fov: "12deg" },        // cork at the top of 1362A
            monitoring: { orbit: "35deg 78deg 40m", target: "-1272.5m 3.4m 303.4m", fov: "12deg" },    // cork at the top of 1362B
        };
        const viewSelect = document.getElementById("view-select");

        function setView(name, { jump = false } = {}) {
            const v = cameraViews[name];
            viewer.cameraTarget = v.target;
            viewer.cameraOrbit = v.orbit;
            viewer.fieldOfView = v.fov;
            if (jump) viewer.jumpCameraToGoal();
            viewSelect.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.view === name));
        }

        viewSelect.addEventListener("click", e => {
            const b = e.target.closest("button[data-view]");
            if (b) setView(b.dataset.view);
        });

        // Dragging or zooming by hand leaves the preset, so un-highlight it
        viewer.addEventListener("camera-change", e => {
            if (e.detail.source === "user-interaction") {
                viewSelect.querySelectorAll("button").forEach(b => b.classList.remove("active"));
            }
        });

        function loadModel(src, hotspotsId, button) {
            // Highlight the selected model button
            document.querySelectorAll(".model-select button").forEach(el => el.classList.remove("active"));
            if (button) button.classList.add("active");

            // Remove any labels from the previous model
            viewer.querySelectorAll(".Hotspot, .DimAnchor").forEach(el => el.remove());

            // Add this model's labels, if it has any
            if (hotspotsId) {
                const template = document.getElementById(hotspotsId);
                viewer.appendChild(template.content.cloneNode(true));
            }

            // The camera presets only make sense for the seafloor model
            viewSelect.hidden = !hotspotsId;

            // Reset the camera so each model is framed fresh
            setView("overview");

            viewer.src = src;
        }

        viewer.addEventListener("load", () => viewer.jumpCameraToGoal());

        customElements.whenDefined("model-viewer").then(() => {
            requestAnimationFrame(updateDimensions);
        });

        // Dimension lines: connect pairs of (invisible or labeled) hotspot
        // anchors with a line, labeled with the real-world distance between
        // them, computed from their data-position attributes.
        const dimensionPairs = [
            ["dim-1026B", "dim-1362A"],
            ["dim-1362A", "dim-1362B"],
            ["hs-basement-cornerC", "hs-seafloor-corner"],
            ["hs-basement-cornerA", "hs-basement-cornerB"],
            ["hs-basement-cornerB", "hs-basement-cornerC"],
        ];
        const dimensionSvg = document.getElementById("dimension-overlay");
        const viewerWrap = document.querySelector(".viewer-wrap");

        function parsePosition(el) {
            return el.getAttribute("data-position").trim().split(/\s+/).map(parseFloat);
        }

        // Layer labels: stacked in an evenly spaced vertical column at the side of the viewer nearest the
        // west wall, each joined by a leader line to an anchor at that layer's mid-depth on the wall.
        // Swatch colours are the layers' glTF base colours converted from linear to sRGB (what the viewer displays)
        const layerLabels = [
            { id: "layer-anchor-0", text: "Upper pillow basalt", color: "#898e95" },
            { id: "layer-anchor-1", text: "Hyaloclastite breccia", color: "#c4aa89" },
            { id: "layer-anchor-2", text: "Massive & sheet flows", color: "#6c737c" },
            { id: "layer-anchor-3", text: "Lower pillow basalt", color: "#9b959e" },
            { id: "layer-anchor-4", text: "Undifferentiated basalt", color: "#616169" },
        ];
        const LABEL_H = 22, LABEL_GAP = 8, LABEL_MARGIN = 14, LABEL_LEAD = 40;   // LEAD: min px between column and nearest anchor

        // The column only appears when the viewer is zoomed in on the west side of the model
        const LABEL_MAX_SPAN = 7000;     // m of scene visible across the view; zoomed out further than this, hide
        const LABEL_MAX_ANGLE = 55;      // degrees the camera may be off straight-on to the west wall
        const LABEL_EDGE_PAD = 20;       // px; every anchor must be this far inside the viewer

        // Scene width (m) visible across the view at the orbit target
        function visibleSpan() {
            return 2 * viewer.getCameraOrbit().radius * Math.tan(viewer.getFieldOfView() * Math.PI / 360);
        }
        const DIMENSION_MIN_SPAN = 200;  // m; dimension lines are hidden when zoomed in closer than this

        function westWallInFocus() {
            const { theta } = viewer.getCameraOrbit();
            const span = visibleSpan();
            const thetaModel = theta - viewer.turntableRotation;            // camera azimuth in model space, as the compass uses
            const facing = -Math.sin(thetaModel);                           // 1 = looking straight at the west (-X) wall
            return span < LABEL_MAX_SPAN && facing > Math.cos(LABEL_MAX_ANGLE * Math.PI / 180);
        }

        function layerLabelsSvg(wrapRect) {
            if (!westWallInFocus()) return "";
            const items = [];
            for (const l of layerLabels) {
                const el = document.getElementById(l.id);
                if (!el || !el.hasAttribute("data-visible")) continue;
                const r = el.getBoundingClientRect();
                items.push({ ...l, ax: r.left - wrapRect.left, ay: r.top - wrapRect.top });
            }
            // Show the column only if every anchor is actually on screen (west wall in view, not just facing us)
            const pad = LABEL_EDGE_PAD;
            const allInView = items.length === layerLabels.length && items.every(i =>
                i.ax > pad && i.ax < wrapRect.width - pad && i.ay > pad && i.ay < wrapRect.height - pad);
            if (!allInView) return "";

            // One column of equal-width labels. It sits wholly to one side of every anchor (left of the leftmost
            // or right of the rightmost, plus a lead-in), so no leader ever has to pass back across a label.
            items.sort((a, b) => a.ay - b.ay);
            const w = Math.max(...items.map(i => i.text.length)) * 6.4 + 30;
            const minX = Math.min(...items.map(i => i.ax)), maxX = Math.max(...items.map(i => i.ax));
            const leftX = minX - LABEL_LEAD - w;                             // column's left edge if placed on the left
            const rightX = maxX + LABEL_LEAD;                                // ... and if placed on the right
            const leftOk = leftX >= LABEL_MARGIN;
            const rightOk = rightX + w <= wrapRect.width - LABEL_MARGIN;
            if (!leftOk && !rightOk) return "";
            const onLeft = leftOk && (!rightOk || minX - leftX - w <= rightX - maxX || (leftX + w / 2) < wrapRect.width / 2);
            const x = onLeft ? leftX : rightX;
            const edge = onLeft ? x + w : x;

            // Even vertical spacing, centred on the anchors, kept inside the viewer
            const pitch = LABEL_H + LABEL_GAP;
            const mean = items.reduce((sum, i) => sum + i.ay, 0) / items.length;
            const total = pitch * (items.length - 1);
            const top = Math.min(Math.max(mean - total / 2, LABEL_H), wrapRect.height - LABEL_H - total);

            let lines = "", boxes = "";                                       // lines first so labels always paint on top
            items.forEach((it, n) => {
                const cy = top + n * pitch;
                lines += `
                    <line x1="${edge}" y1="${cy}" x2="${it.ax}" y2="${it.ay}" style="stroke: var(--ink); stroke-width: 1;" />
                    <circle cx="${it.ax}" cy="${it.ay}" r="3" style="fill: ${it.color}; stroke: white; stroke-width: 1.5;" />`;
                boxes += `
                    <rect x="${x}" y="${cy - LABEL_H / 2}" width="${w}" height="${LABEL_H}" rx="5" style="fill: var(--panel-bg); stroke: rgba(0,0,0,0.25);" />
                    <rect x="${x + 7}" y="${cy - 5}" width="10" height="10" rx="2" style="fill: ${it.color};" />
                    <text x="${x + 23}" y="${cy + 4}" style="font: 500 12px 'Inter', sans-serif; fill: var(--ink);">${it.text.replace("&", "&amp;")}</text>`;
            });
            return lines + boxes;
        }

        function updateDimensions() {
            const wrapRect = viewerWrap.getBoundingClientRect();
            let svgContent = "";

            const closeUp = visibleSpan() < DIMENSION_MIN_SPAN;

            for (const [aId, bId] of closeUp ? [] : dimensionPairs) {
                const aEl = document.getElementById(aId);
                const bEl = document.getElementById(bId);
                if (!aEl || !bEl) continue;
                if (!aEl.hasAttribute("data-visible") || !bEl.hasAttribute("data-visible")) continue;

                const aRect = aEl.getBoundingClientRect();
                const bRect = bEl.getBoundingClientRect();
                const x1 = aRect.left - wrapRect.left;
                const y1 = aRect.top - wrapRect.top;
                const x2 = bRect.left - wrapRect.left;
                const y2 = bRect.top - wrapRect.top;
                const midX = (x1 + x2) / 2;
                const midY = (y1 + y2) / 2;

                const [ax, ay, az] = parsePosition(aEl);
                const [bx, by, bz] = parsePosition(bEl);
                const distance = Math.hypot(ax - bx, ay - by, az - bz);
                const label = `${Math.round(distance)} m`;

                svgContent += `
                    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3;" />
                    <circle cx="${x1}" cy="${y1}" r="3" style="fill: var(--accent);" />
                    <circle cx="${x2}" cy="${y2}" r="3" style="fill: var(--accent);" />
                    <text x="${midX}" y="${midY - 6}" text-anchor="middle" style="font: 600 12px 'Inter', sans-serif; fill: var(--ink); paint-order: stroke; stroke: white; stroke-width: 3px;">${label}</text>
                `;
            }

            svgContent += layerLabelsSvg(wrapRect);
            dimensionSvg.innerHTML = svgContent;
            requestAnimationFrame(updateDimensions);
        }

        // Compass: model north is the -Z axis. Two things rotate the model
        // horizontally, and model-viewer treats them differently:
        //   - dragging orbits the camera (theta), which fires camera-change
        //   - auto-rotate spins the model itself (turntableRotation, in radians)
        //     and fires NO event, so it has to be polled every frame.
        const compassNeedle = document.getElementById("compass-needle");

        function updateCompass() {
            const { theta } = viewer.getCameraOrbit();
            const angle = theta - viewer.turntableRotation;
            compassNeedle.style.transform = `rotate(${angle * 180 / Math.PI}deg)`;
            requestAnimationFrame(updateCompass);
        }

        customElements.whenDefined("model-viewer").then(() => {
            requestAnimationFrame(updateCompass);
        });

        // Show the seafloor labels on first load
        loadModel("seafloor_v4.glb", "hotspots-seafloor", document.querySelector(".model-select button.active"));
    </script>
</body>
</html>

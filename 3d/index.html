<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solid Carbon 3D Explorer</title>

    <!-- Browser Icon -->
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../assets/android-chrome-512x512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/android-chrome-192x192.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <link rel="stylesheet" href="css/viewer.css?v=20261064">
</head>
<body>

    <header id="topbar">
        <div class="topbar-title">
            <h1><img src="../assets/logo.svg" alt="">Solid Carbon 3D Explorer</h1>
        </div>
    </header>

    <main>
        <div class="controls">
            <div class="model-select">
                <button onclick="loadModel('seafloor_v5_blender.glb', this)" class="active"><span class="full">Seafloor (to scale)</span><span class="short">To scale</span></button>
                <button onclick="loadModel('Exaggerated_v2_blender.glb', this)"><span class="full">Seafloor (5× vertical)</span><span class="short">5× vertical</span></button>
                <button onclick="loadModel('cork1362A-draco.glb', this)">CORK 1362A</button>
            </div>
            <!-- Camera presets for the seafloor models (see seafloorModels in the script) -->
            <div class="view-select" id="view-select">
                <button data-view="overview" class="active">Overview</button>
                <button data-view="layers"><span class="full">Basement Layers</span><span class="short">Layers</span></button>
                <button data-view="injection"><span class="full">Injection site</span><span class="short">Injection</span></button>
                <button data-view="monitoring"><span class="full">Monitoring site</span><span class="short">Monitoring</span></button>
            </div>
            <!-- Camera presets for the CORK model (see corkModels in the script) -->
            <div class="view-select" id="cork-view-select" hidden>
                <button data-view="wellhead" class="active">Wellhead</button>
                <button data-view="layout"><span class="full">Site layout</span><span class="short">Layout</span></button>
                <button data-view="whole"><span class="full">Whole model</span><span class="short">Whole</span></button>
            </div>
        </div>

        <!-- Says whether the seafloor model on show is to scale or exaggerated (text set in loadModel) -->
        <p id="scale-note" class="scale-note" hidden></p>

        <div class="viewer-wrap">
            <model-viewer
                id="viewer"
                src="seafloor_v5_blender.glb"
                camera-controls
                ar
                tone-mapping="neutral"
                shadow-intensity="0"
                min-camera-orbit="auto auto 15m"
                min-field-of-view='1deg'>
            </model-viewer>

            <div id="scale-badge" hidden></div>

            <!-- Show or hide parts of the seafloor models (see LAYER_GROUPS in layer-toggles.js) -->
            <div id="layer-toggles" class="layer-toggles">
                <span class="layer-toggles-title">Show</span>
                <label><input type="checkbox" data-group="water" checked> Water</label>
                <label><input type="checkbox" data-group="sediment" checked> Sediment</label>
                <label><input type="checkbox" data-group="basement" checked> Basement</label>
            </div>

            <!-- Down the left of the viewer with the CORK model: what the pins mean, and under it the panel for the pin picked -->
            <div class="cork-side">
            <div id="cork-key" class="cork-key" hidden>
                <span class="cork-chip installed">On site now</span><span class="cork-chip planned">Planned</span>
                <p>Click a pin for details. Tools around the CORK show in <strong>Site layout</strong>.</p>
                <label class="pins-toggle"><input type="checkbox" id="pins-toggle" checked> Show pins</label>
            </div>

            <!-- Filled in from cork-tools.js when a pin is clicked -->
            <div id="tool-popup" class="tool-popup" hidden>
                <button type="button" id="tool-popup-close" class="tool-popup-close" aria-label="Close">×</button>
                <figure id="tool-figure">
                    <img id="tool-image" alt="">
                    <figcaption id="tool-image-note"></figcaption>
                </figure>
                <span id="tool-status" class="cork-chip"></span>
                <h3 id="tool-name"></h3>
                <p class="tool-where" id="tool-where"></p>
                <p id="tool-purpose"></p>
                <p id="tool-link-line"><a id="tool-link" target="_blank" rel="noopener"></a></p>
            </div>
            </div>

            <svg id="dimension-overlay"></svg>

            <div id="compass">
            <svg viewBox="0 0 72 72" aria-label="Compass">
                <circle cx="36" cy="36" r="33" fill="none" stroke="currentColor" stroke-opacity="0.25" />
                <g id="compass-needle">
                    <polygon points="36,19 42,36 30,36" style="fill: var(--accent);" />
                    <polygon points="36,53 42,36 30,36" fill="#999" />
                    <text x="36" y="15" text-anchor="middle" font-size="11" font-weight="700" font-family="Inter, sans-serif" style="fill: var(--accent);">N</text>
                    <g font-size="9" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle" fill="#666">
                        <text x="36" y="66">S</text>
                        <text x="63" y="39.5">E</text>
                        <text x="9" y="39.5">W</text>
                    </g>
                </g>
                <circle cx="36" cy="36" r="2.5" fill="#333" />
            </svg>
            </div>
        </div>
    </main>


    <script src="js/models.js?v=20261064"></script>
    <script src="js/cork-tools.js?v=20261064"></script>
    <script src="js/layer-toggles.js?v=20261064"></script>
    <script src="js/seafloor-overlay.js?v=20261064"></script>
    <script src="js/cork-pins.js?v=20261064"></script>
    <script src="js/viewer.js?v=20261064"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solid Carbon 3D Explorer</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        :root {
            --ink: #14293b;
            --muted: #5b6b76;
            --accent: #1f7a8c;
            --panel-bg: rgba(255, 255, 255, 0.97);
            --panel-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
            --radius: 5px;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #eef2f3;
            color: var(--ink);
        }

        :root { --topbar-height: 56px; }

        #topbar {
            height: var(--topbar-height);
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr minmax(0, auto) 1fr;
            align-items: center;
            padding: 0 16px;
            background: var(--ink);
            border-bottom: 3px solid var(--accent);
        }

        .topbar-title {
            grid-column: 2;
            text-align: center;
        }

        .topbar-title h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 0;
            font-family: "Barlow Condensed", "Inter", sans-serif;
            font-size: 30px;
            line-height: 1.05;
            text-transform: uppercase;
            font-weight: 400;
            -webkit-text-stroke: 0.011em currentColor;
            color: white;
            letter-spacing: 0.04em;
        }

        .topbar-title h1 img {
            height: 0.91em;
            width: auto;
            position: relative;
            top: 0.05em;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        /* Model and camera-view selectors, styled as segmented pill controls */
        .model-select, .view-select {
            display: flex;
            gap: 4px;
            width: fit-content;
            padding: 5px;
            background: var(--panel-bg);
            border-radius: 999px;
            box-shadow: var(--panel-shadow);
        }

        .model-select button, .view-select button {
            border: none;
            background: transparent;
            padding: 8px 18px;
            border-radius: 999px;
            font: 600 13px "Inter", sans-serif;
            color: var(--muted);
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .model-select button:hover, .view-select button:hover {
            background: #eef4f5;
            color: var(--accent);
        }

        .model-select button.active, .view-select button.active {
            background: var(--accent);
            color: white;
        }

        .viewer-wrap {
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--panel-shadow);
        }

        model-viewer {
            width: 100%;
            height: 75vh;
            background-color: #fcfbfb;
        }

        .view-select[hidden] {
            display: none;
        }

        /* Invisible points that model-viewer keeps projected onto the screen; the overlay below draws from them */
        .DimAnchor {
            width: 0;
            height: 0;
            padding: 0;
            border: 0;
        }

        /* Dimension lines/labels overlay */
        #dimension-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* Overlay drawing: dimension lines, borehole labels, and the layer label column */
        .ov-dim-line { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; }
        .ov-dot { fill: var(--accent); }
        .ov-dim-text { font: 600 12px "Inter", sans-serif; fill: var(--ink); paint-order: stroke; stroke: white; stroke-width: 3px; }
        .ov-text { font: 500 10px "Inter", sans-serif; fill: var(--ink); }
        .ov-shadow { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.4)); }
        .ov-pill { fill: var(--panel-bg); }
        .ov-pill-outlined { fill: var(--panel-bg); stroke: rgba(0, 0, 0, 0.25); }
        .ov-leader { stroke: var(--ink); stroke-width: 1; }
        .ov-anchor-dot { stroke: white; stroke-width: 1.5; }

        /* Compass: tracks the horizontal (azimuth) rotation of the model */
        #compass {
            position: absolute;
            right: 16px;
            bottom: 16px;
            width: 72px;
            height: 72px;
            z-index: 6;
            pointer-events: none;
            background: var(--panel-bg);
            border-radius: 50%;
            box-shadow: var(--panel-shadow);
        }

        #compass svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        #compass-needle {
            transform-box: view-box;
            transform-origin: 36px 36px;
        }
    </style>
</head>
<body>

    <header id="topbar">
        <div class="topbar-title">
            <h1><img src="../assets/logo.svg" alt="">Solid Carbon 3D Explorer</h1>
        </div>
    </header>

    <main>
        <div class="controls">
            <div class="model-select">
                <button onclick="loadModel('seafloor_v4.glb', true, this)" class="active">Seafloor</button>
                <button onclick="loadModel('cork-draco.glb', false, this)">Cork</button>
                <button onclick="loadModel('cork1362A-draco.glb', false, this)">Cork 1362A</button>
            </div>
            <!-- Camera presets for the seafloor model (see cameraViews in the script) -->
            <div class="view-select" id="view-select">
                <button data-view="overview" class="active">Overview</button>
                <button data-view="layers">Basement Layers</button>
                <button data-view="injection">Injection site</button>
                <button data-view="monitoring">Monitoring site</button>
            </div>
        </div>

        <div class="viewer-wrap">
            <model-viewer
                id="viewer"
                src="seafloor_v4.glb"
                camera-controls
                ar
                tone-mapping="neutral"
                shadow-intensity="0"
                min-camera-orbit="auto auto 15m"
                min-field-of-view='1deg'>
            </model-viewer>

            <svg id="dimension-overlay"></svg>

            <div id="compass">
            <svg viewBox="0 0 72 72" aria-label="Compass">
                <circle cx="36" cy="36" r="33" fill="none" stroke="currentColor" stroke-opacity="0.25" />
                <g id="compass-needle">
                    <polygon points="36,19 42,36 30,36" style="fill: var(--accent);" />
                    <polygon points="36,53 42,36 30,36" fill="#999" />
                    <text x="36" y="15" text-anchor="middle" font-size="11" font-weight="700" font-family="Inter, sans-serif" style="fill: var(--accent);">N</text>
                    <g font-size="9" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle" fill="#666">
                        <text x="36" y="66">S</text>
                        <text x="63" y="39.5">E</text>
                        <text x="9" y="39.5">W</text>
                    </g>
                </g>
                <circle cx="36" cy="36" r="2.5" fill="#333" />
            </svg>
            </div>
        </div>
    </main>

    <script>
        const viewer = document.getElementById("viewer");
        const viewerWrap = document.querySelector(".viewer-wrap");
        const overlay = document.getElementById("dimension-overlay");

        // ---- Scene anchors ------------------------------------------------------------------------------------
        // Everything drawn over the seafloor model (borehole labels, dimension lines, the layer label column) hangs
        // off invisible anchors that model-viewer keeps projected onto the screen. Positions are scene metres
        // [x, y, z]; -Z is north, Y is up, and the seafloor is y = 0.
        const WEST = -2400, EAST = 2100, NORTH = -1577.300048828125, SOUTH = 1922.699951171875, FLOOR = -700;

        const boreholes = [
            { id: "1026B", pos: [-1053.2547602494767, 0, -178.7172727747188] },
            { id: "1362A", pos: [-1202.4134293512127, 0, 1.9995459612104014] },
            { id: "1362B", pos: [-1274.2148534180235, 0, 305.8217231597523] },
            { id: "1301B", pos: [-1513.61040564326, 0, 775.4433657001365] },
            { id: "1027C", pos: [1059.5668762121697, 0, 470.97399151243013] },
        ];

        // Footprint corners: the bottom of the layers (FLOOR) and the seafloor above the back-right one
        const corners = {
            A: [WEST, FLOOR, NORTH],
            B: [EAST, FLOOR, NORTH],
            C: [EAST, FLOOR, SOUTH],
            seafloor: [EAST, 0, NORTH],
        };

        // The label column, top to bottom. Each points at its layer's mid-depth (y) on the west wall at z = WALL_Z.
        // Swatch colours are the layers' glTF base colours converted from linear to sRGB (what the viewer displays).
        // Optional entries drop out of the column when their anchor is off-screen.
        const WALL_Z = 897.8;
        const layerLabels = [
            { text: "Seafloor", color: "#a0d5ff", y: 0, optional: true },
            { text: "Sediments", color: "#d9cdb8", y: -160, optional: true },    // seafloor to top of basement
            { text: "Upper pillow basalt", color: "#898e95", y: -362.1 },
            { text: "Hyaloclastite breccia", color: "#c4aa89", y: -403.6 },
            { text: "Massive & sheet flows", color: "#6c737c", y: -421.0 },
            { text: "Lower pillow basalt", color: "#9b959e", y: -473.1 },
            { text: "Undifferentiated basalt", color: "#616169", y: -604.0 },
        ];

        const anchors = [
            ...boreholes.map(b => ({ id: `bh-${b.id}`, pos: b.pos })),
            ...Object.entries(corners).map(([k, pos]) => ({ id: `corner-${k}`, pos })),
            ...layerLabels.map((l, i) => ({ id: `layer-${i}`, pos: [WEST, l.y, WALL_Z], normal: [-1, 0, 0] })),
        ];
        const anchorPosition = Object.fromEntries(anchors.map(a => [a.id, a.pos]));

        function addAnchors() {
            anchors.forEach(({ id, pos, normal = [0, 1, 0] }, n) => {
                const el = document.createElement("button");
                el.id = id;
                el.className = "DimAnchor";
                el.slot = `hotspot-${n}`;
                el.dataset.position = pos.map(v => `${v}m`).join(" ");
                el.dataset.normal = normal.map(v => `${v}m`).join(" ");
                el.dataset.visibilityAttribute = "visible";
                viewer.appendChild(el);
            });
        }

        // Camera presets. orbit = "azimuth polar radius" about the target; azimuth is measured from +Z (south),
        // so -90deg looks at the west face. Positions are scene metres.
        const cameraViews = {
            overview:   { orbit: "0deg 75deg auto", target: "auto auto auto", fov: "auto" },
            layers:     { orbit: "-62deg 74deg 1500m", target: "-2400m -300m 900m", fov: "30deg" },   // west wall, labels in view
            // Close-ups: a narrow field of view from ~40 m away fills the frame with the ~7 m cork. Moving the camera
            // in closer instead would put the cork inside model-viewer's near plane (about 10 m here) and clip it.
            injection:  { orbit: "63deg 78deg 40m", target: "-1203.3m 3.4m 0m", fov: "12deg" },        // cork at the top of 1362A
            monitoring: { orbit: "77deg 78deg 40m", target: "-1272.5m 3.4m 303.4m", fov: "12deg" },    // cork at the top of 1362B
        };
        const viewSelect = document.getElementById("view-select");
        const viewButtons = [...viewSelect.querySelectorAll("button")];

        function markView(name) {
            viewButtons.forEach(b => b.classList.toggle("active", b.dataset.view === name));
        }

        function setView(name) {
            const v = cameraViews[name];
            viewer.cameraTarget = v.target;
            viewer.cameraOrbit = v.orbit;
            viewer.fieldOfView = v.fov;
            markView(name);
        }

        viewSelect.addEventListener("click", e => {
            const b = e.target.closest("button[data-view]");
            if (b) setView(b.dataset.view);
        });

        // Dragging or zooming by hand leaves the preset, so un-highlight it
        viewer.addEventListener("camera-change", e => {
            if (e.detail.source === "user-interaction") markView(null);
        });

        function loadModel(src, withAnchors, button) {
            // Highlight the selected model button
            document.querySelectorAll(".model-select button").forEach(el => el.classList.remove("active"));
            if (button) button.classList.add("active");

            // Swap the anchors, and show the camera presets, only for the seafloor model
            viewer.querySelectorAll(".DimAnchor").forEach(el => el.remove());
            if (withAnchors) addAnchors();
            viewSelect.hidden = !withAnchors;

            // Reset the camera so each model is framed fresh
            setView("overview");

            viewer.src = src;
        }

        viewer.addEventListener("load", () => viewer.jumpCameraToGoal());

        // ---- Overlay ------------------------------------------------------------------------------------------
        const CHAR_W = 5.4;                                  // px per character at 10px Inter, used to size the pills
        const escapeText = t => t.replace("&", "&amp;");

        // Screen position of an anchor relative to the viewer, or null while model-viewer says it isn't visible
        function anchorPos(id, wrap) {
            const el = document.getElementById(id);
            if (!el || !el.hasAttribute("data-visible")) return null;
            const r = el.getBoundingClientRect();
            return { x: r.left - wrap.left, y: r.top - wrap.top };
        }

        // Scene width (m) visible across the view at the orbit target
        const visibleSpan = orbit => 2 * orbit.radius * Math.tan(viewer.getFieldOfView() * Math.PI / 360);

        // Clip the segment a-b to the viewer rectangle (Liang-Barsky); returns the visible parameter range or null
        function clipToView(a, b, w, h, pad = 6) {
            let t0 = 0, t1 = 1;
            const dx = b.x - a.x, dy = b.y - a.y;
            for (const [p, q] of [[-dx, a.x - pad], [dx, w - pad - a.x], [-dy, a.y - pad], [dy, h - pad - a.y]]) {
                if (p === 0) { if (q < 0) return null; continue; }
                const t = q / p;
                if (p < 0) { if (t > t1) return null; t0 = Math.max(t0, t); }
                else { if (t < t0) return null; t1 = Math.min(t1, t); }
            }
            return [t0, t1];
        }

        // Dimension lines connect pairs of anchors and are labelled with the real distance between them.
        // "cork" lines run between boreholes along the seafloor, so they stay visible in the close-up cork views;
        // the footprint lines are hidden there because they would cut across the cork.
        const dimensionPairs = [
            ["bh-1026B", "bh-1362A", "cork"],
            ["bh-1362A", "bh-1362B", "cork"],
            ["corner-B", "corner-seafloor"],
            ["corner-A", "corner-B"],
            ["corner-B", "corner-C"],
        ];
        const DIMENSION_MIN_SPAN = 200;             // m; footprint lines are hidden when zoomed in closer than this

        function dimensionsSvg(wrap, closeUp) {
            let svg = "";
            for (const [aId, bId, kind] of dimensionPairs) {
                if (closeUp && kind !== "cork") continue;
                const a = anchorPos(aId, wrap), b = anchorPos(bId, wrap);
                if (!a || !b) continue;

                // Only the on-screen part of the line is drawn, and its label sits at the middle of that part, so
                // a line to a far-away borehole still shows (and is readable) when zoomed in on a cork
                const clip = clipToView(a, b, wrap.width, wrap.height);
                if (!clip) continue;
                const at = t => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
                const p = at(clip[0]), q = at(clip[1]);
                const dot = e => (e.x >= 0 && e.x <= wrap.width && e.y >= 0 && e.y <= wrap.height)
                    ? `<circle class="ov-dot" cx="${e.x}" cy="${e.y}" r="3" />` : "";

                const distance = Math.hypot(...anchorPosition[aId].map((v, i) => v - anchorPosition[bId][i]));
                svg += `
                    <line class="ov-dim-line" x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" />
                    ${dot(a)}${dot(b)}
                    <text class="ov-dim-text" x="${(p.x + q.x) / 2}" y="${(p.y + q.y) / 2 - 6}" text-anchor="middle">${Math.round(distance)} m</text>`;
            }
            return svg;
        }

        // Borehole labels, centred on their anchors. Drawn after the dimension lines so they sit in front of them.
        function boreholeLabelsSvg(wrap) {
            return boreholes.map(b => {
                const c = anchorPos(`bh-${b.id}`, wrap);
                if (!c) return "";
                const text = `Borehole ${b.id}`, w = text.length * CHAR_W + 16, h = 20;
                return `
                    <g class="ov-shadow"><rect class="ov-pill" x="${c.x - w / 2}" y="${c.y - h / 2}" width="${w}" height="${h}" rx="5" /></g>
                    <text class="ov-text" x="${c.x}" y="${c.y + 3.5}" text-anchor="middle">${text}</text>`;
            }).join("");
        }

        // Layer labels: an evenly spaced vertical column beside the west wall, each joined by a leader line to its
        // layer. Only shown when the camera is on the west side, zoomed in enough, with every layer anchor on screen.
        const LABEL_H = 18, LABEL_GAP = 6, LABEL_MARGIN = 14, LABEL_LEAD = 40;   // LEAD: min px between column and nearest anchor
        const LABEL_MAX_SPAN = 7000;     // m of scene visible across the view; zoomed out further than this, hide
        const LABEL_MAX_ANGLE = 55;      // degrees the camera may be off straight-on to the west wall
        const LABEL_EDGE_PAD = 20;       // px; every anchor must be this far inside the viewer

        function westWallInFocus(orbit, span) {
            const thetaModel = orbit.theta - viewer.turntableRotation;      // camera azimuth in model space, as the compass uses
            const facing = -Math.sin(thetaModel);                           // 1 = looking straight at the west (-X) wall
            return span < LABEL_MAX_SPAN && facing > Math.cos(LABEL_MAX_ANGLE * Math.PI / 180);
        }

        function layerLabelsSvg(wrap, orbit, span) {
            if (!westWallInFocus(orbit, span)) return "";
            const items = [];
            layerLabels.forEach((l, i) => {
                const p = anchorPos(`layer-${i}`, wrap);
                if (p) items.push({ ...l, ax: p.x, ay: p.y });
            });
            const pad = LABEL_EDGE_PAD;
            const inView = i => i.ax > pad && i.ax < wrap.width - pad && i.ay > pad && i.ay < wrap.height - pad;
            const required = layerLabels.filter(l => !l.optional);
            if (!required.every(l => items.some(i => i.text === l.text && inView(i)))) return "";
            const shown = items.filter(inView);

            const w = Math.max(...shown.map(i => i.text.length)) * CHAR_W + 26;
            const minX = Math.min(...shown.map(i => i.ax)), maxX = Math.max(...shown.map(i => i.ax));
            const leftX = minX - LABEL_LEAD - w;                             // column's left edge if placed on the left
            const rightX = maxX + LABEL_LEAD;                                // ... and if placed on the right
            const leftOk = leftX >= LABEL_MARGIN;
            const rightOk = rightX + w <= wrap.width - LABEL_MARGIN;
            if (!leftOk && !rightOk) return "";
            const onLeft = leftOk && (!rightOk || minX - leftX - w <= rightX - maxX || (leftX + w / 2) < wrap.width / 2);
            const x = onLeft ? leftX : rightX;
            const edge = onLeft ? x + w : x;

            // Even vertical spacing, centred on the anchors, kept inside the viewer
            const pitch = LABEL_H + LABEL_GAP;
            const mean = shown.reduce((sum, i) => sum + i.ay, 0) / shown.length;
            const total = pitch * (shown.length - 1);
            const top = Math.min(Math.max(mean - total / 2, LABEL_H), wrap.height - LABEL_H - total);

            let lines = "", boxes = "";
            shown.forEach((it, n) => {
                const cy = top + n * pitch;
                lines += `
                    <line class="ov-leader" x1="${edge}" y1="${cy}" x2="${it.ax}" y2="${it.ay}" />
                    <circle class="ov-anchor-dot" cx="${it.ax}" cy="${it.ay}" r="3" style="fill: ${it.color};" />`;
                boxes += `
                    <rect class="ov-pill-outlined" x="${x}" y="${cy - LABEL_H / 2}" width="${w}" height="${LABEL_H}" rx="5" />
                    <rect x="${x + 6}" y="${cy - 4}" width="8" height="8" rx="2" style="fill: ${it.color};" />
                    <text class="ov-text" x="${x + 19}" y="${cy + 3.5}">${escapeText(it.text)}</text>`;
            });
            return lines + boxes;
        }

        // ---- Compass ------------------------------------------------------------------------------------------
        // Model north is the -Z axis.
        //   - dragging orbits the camera (theta), which fires camera-change
        //   - auto-rotate spins the model itself (turntableRotation, in radians)
        //     and fires NO event, so it has to be polled every frame.
        const compassNeedle = document.getElementById("compass-needle");

        // One frame loop for the overlay and the compass
        function frame() {
            const wrap = viewerWrap.getBoundingClientRect();
            const orbit = viewer.getCameraOrbit();
            const span = visibleSpan(orbit);

            overlay.innerHTML = dimensionsSvg(wrap, span < DIMENSION_MIN_SPAN)
                + boreholeLabelsSvg(wrap)
                + layerLabelsSvg(wrap, orbit, span);

            compassNeedle.style.transform = `rotate(${(orbit.theta - viewer.turntableRotation) * 180 / Math.PI}deg)`;
            requestAnimationFrame(frame);
        }

        customElements.whenDefined("model-viewer").then(() => requestAnimationFrame(frame));

        // Show the seafloor labels on first load
        loadModel("seafloor_v4.glb", true, document.querySelector(".model-select button.active"));
    </script>
</body>
</html>
